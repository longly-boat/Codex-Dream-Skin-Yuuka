name: "Bug report / 缺陷反馈"
description: "Yuuka install, theme, tray, takeover or restore failed / 优香版安装、换肤、托盘、接管或恢复问题"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill every required field — incomplete reports may be closed.
        感谢反馈！请尽量填全必填项；信息过少的 Issue 可能会被关闭。

        Yuuka v1.9.2 ships for Windows x64 only. macOS and Linux are inherited sources without native Yuuka acceptance testing or release packages.
        优香 v1.9.2 仅发行 Windows x64。macOS 和 Linux 为继承源码，尚未完成优香版原生验收或发行。

        **Please try self-check first / 请先自检：**
        - **Windows:** Run `%LOCALAPPDATA%\CodexDreamSkinYuuka\engine\scripts\verify-dream-skin.ps1` in PowerShell, or the same script under `windows/scripts/` in a source checkout. See the [Windows guide](https://github.com/longly-boat/Codex-Dream-Skin-Yuuka/blob/main/windows/README.md) for restore and migration steps.
        - **Inherited platforms / 继承平台:** If reporting a source experiment, state the platform, commit and unverified behavior explicitly. / 若反馈源码试用问题，请注明平台、提交和未验证的行为。
        - Search existing issues / 先搜一下是否已有相同 Issue。

        **Do not paste / 请勿粘贴：** API keys, `auth.json`, relay tokens, private chat content.
        **不要贴：** API Key、`auth.json`、中转密钥、隐私对话内容。

        This project only themes via **loopback CDP**. It does **not** modify official `.app` / `app.asar` / WindowsApps, and does **not** rewrite API Base URL / keys.
        本项目仅通过 **本机回环 CDP** 换肤，**不修改**官方安装包与签名，**不会**改写 API Base URL / Key。

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      description: Where did this happen? / 出问题的系统
      options:
        - Windows x64 (supported release) / Windows x64（发行版）
        - Windows ARM (not yet supported) / Windows ARM（暂未支持）
        - macOS (inherited source) / macOS（继承源码）
        - Linux (inherited source) / Linux（继承源码）
        - Unsure / 不确定
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version / 系统版本
      description: Include the OS edition and build / 请注明系统版本与内部版本号
      placeholder: "Windows 11 24H2 · x64"
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: CPU / 架构
      options:
        - Windows x64
        - Windows ARM (not yet supported)
        - Apple Silicon (inherited source)
        - Intel Mac (inherited source)
        - Other / 其他
        - Unsure / 不确定
    validations:
      required: true

  - type: input
    id: codex_version
    attributes:
      label: Codex Desktop version / source / Codex 桌面版版本或来源
      description: App version if known and install source; Windows Yuuka targets the official Microsoft Store OpenAI.Codex app. / 版本号及安装来源；Windows 优香版面向微软商店官方 OpenAI.Codex。
      placeholder: "Codex version · Microsoft Store"
    validations:
      required: true

  - type: input
    id: dream_skin_version
    attributes:
      label: Dream Skin Yuuka version / 优香版皮肤工具版本
      description: |
        Use the Setup filename or `windows/VERSION`; include the commit for a source install.
        请填写 Setup 文件名中的版本或 `windows/VERSION`；源码安装同时注明 commit。
      placeholder: "1.9.2"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Problem category / 问题类型
      options:
        - Install failed / 安装失败
        - Skin not applied / 启动后无皮肤
        - Layout broken / white screen / 布局异常或白屏
        - Customize image / theme switch / 换图或主题切换
        - Tray / theme manager / 托盘或主题管理器
        - Original entry auto takeover / 原版入口自动接管
        - Inherited platform UI / 继承平台界面
        - Verify / doctor failed / 校验或 doctor 失败
        - Restore failed / 恢复失败
        - Hot reapply / CDP / 热切换或 CDP
        - After Codex app update / Codex 更新后失效
        - Other / 其他
    validations:
      required: true

  - type: checkboxes
    id: self_check
    attributes:
      label: Self-check / 自检
      description: Check what you already tried / 勾选你已做过的步骤
      options:
        - label: Ran Verify / doctor (or Windows verify script) / 已运行 Verify 或 doctor
          required: false
        - label: Tried Restore, then re-apply / 已尝试完全恢复后再应用
          required: false
        - label: Official Codex still opens without the skin tools / 不用皮肤工具时官方 Codex 仍可正常打开
          required: false
        - label: Searched existing issues / 已搜索现有 Issue
          required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Numbered steps help a lot / 请尽量分步骤
      placeholder: |
        1. Install via …
        2. Start / customize …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望结果
      placeholder: "Theme applies; sidebar stays clickable…"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      placeholder: "No banner; injector exits; error dialog…"
    validations:
      required: true

  - type: dropdown
    id: modified_official
    attributes:
      label: Modified official Codex install? / 是否改过官方 Codex 安装？
      description: e.g. patched asar, unsigned rebuild, third-party cracked package / 是否改过 asar、签名或使用非官方魔改包
      options:
        - "No — official app only / 否，仅官方安装"
        - "Yes / 是"
        - "Unsure / 不确定"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Verify / doctor output（recommended）/ 日志与校验输出（强烈建议）
      description: |
        **Windows Yuuka logs:** `%LOCALAPPDATA%\CodexDreamSkinYuuka`
        **Inherited macOS logs:** `~/Library/Application Support/CodexDreamSkinStudio`
        Paste **relevant** lines only; redact secrets and personal paths. Do not upload the whole state directory or `cdp-profile`.
        只贴相关片段，打码密钥与个人路径；不要上传整个状态目录或 `cdp-profile`。
      placeholder: |
        ```
        paste verify / doctor / last log lines here
        ```
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video / 截图或录屏
      description: Drag images here. Avoid private chat content. / 可直接拖拽图片；避免隐私对话内容。
      placeholder: "Attach below / 在下方附加"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Extra context / 其他信息
      description: Setup or source install? Migrated from the original theme? Auto takeover enabled? Paused? Theme name or CDP errors? / Setup 还是源码安装、是否从原版迁移、是否开启自动接管、是否暂停、主题名或 CDP 错误等
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation / 确认
      options:
        - label: I did not paste API keys or secrets / 我未粘贴 API Key 或其它密钥
          required: true
        - label: I understand this is an unofficial theme tool (loopback CDP only) / 我理解这是非官方换肤工具（仅本机 CDP）
          required: true
